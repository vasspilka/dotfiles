[window]
decorations = "None"
startup_mode = "Fullscreen"
dynamic_title = true
opacity = 0.9

[window.dimensions]
columns = 140
lines = 38

[window.padding]
x = 5

[scrolling]
history = 10000
multiplier = 3

[font]
size = 13.25

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[colors.selection]
text = "#ffffff"
background = "#dc3232"

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"

[[keyboard.bindings]]
key = "N"
mods = "Control"
action = "SpawnNewInstance"
